<style>
:root{
 box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#0F2C2A; --panel:#153634; --ink:#EAF6F4; --ink-soft:#A9CFCB; --teal:#3FCFC2; --coral:#FF9A6E; --line:#204A46; --hi:#FFE066; --hi-ink:#3B2F00;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
 --bg:#F3FAF8; --panel:#FFFFFF; --ink:#0F2C2A; --ink-soft:#4B6B6A; --teal:#0E7C74; --coral:#FF8A5B; --line:#D8ECE8; --hi:#FFE066; --hi-ink:#3B2F00;
}}
:root[data-theme="light"]{--bg:#F3FAF8; --panel:#FFFFFF; --ink:#0F2C2A; --ink-soft:#4B6B6A; --teal:#0E7C74; --coral:#FF8A5B; --line:#D8ECE8;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai',sans-serif;}
mark{background:var(--hi);color:var(--hi-ink);padding:1px 5px;border-radius:4px;font-weight:600;}
.deck{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:900px;margin:0 auto;padding:0 18px;}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);flex:0 0 auto;}
.brand{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.langbtn{border:1.5px solid var(--teal);background:transparent;color:var(--teal);border-radius:999px;padding:5px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.stage{flex:1 1 auto;overflow:hidden;position:relative;}
.slide{display:none;height:100%;overflow-y:auto;padding:26px 2px 10px;flex-direction:column;justify-content:flex-start;}
.slide.active{display:flex;}
.kicker{font-size:12.5px;font-weight:600;color:var(--coral);letter-spacing:.3px;margin-bottom:6px;}
h1{font-size:clamp(20px,4.2vw,30px);margin:0 0 8px;font-weight:700;}
h2{font-size:clamp(18px,3.4vw,24px);margin:0 0 14px;font-weight:600;color:var(--teal);}
p{color:var(--ink-soft);margin:0 0 10px;font-size:15px;line-height:1.65;}
ul{margin:0 0 12px;padding-left:20px;}
li{margin-bottom:8px;font-size:14.5px;line-height:1.6;}
.clause{display:inline-block;font-size:11px;background:var(--line);color:var(--teal);border-radius:6px;padding:1px 7px;margin-left:5px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:6px;}
.tag.edit{background:#FFE066;color:#3B2F00;}
.tag.add{background:#3FCFC2;color:#06302C;}
table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13.5px;}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;}
th{background:var(--line);color:var(--ink);}
.impact{border-left:3px solid var(--coral);padding-left:12px;margin-top:10px;}
.impact b{color:var(--coral);}
.center{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;height:100%;}
.ctrl{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:16px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));}
.ctrl button{background:var(--teal);color:#06302C;border:none;border-radius:999px;width:40px;height:40px;font-size:17px;cursor:pointer;font-weight:700;}
.ctrl button:disabled{opacity:.35;cursor:default;}
.ctrl span{font-size:13px;color:var(--ink-soft);min-width:56px;text-align:center;}
</style>
</head>

let lang='th', idx=0;
function tag(items,cls){return items.map(x=>`<div class="card"><span class="tag ${cls}">${cls==='edit'?(lang==='th'?'แก้ไข':'Revise'):(lang==='th'?'เพิ่มเติม':'Add')}</span> <span class="clause">${x.c}</span><p style="margin:6px 0 0">${x[lang][0]} — <mark>${x[lang][1].trim()}</mark></p></div>`).join('');}
function renderStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n'); if(L[k]) el.innerHTML=L[k][lang];});
  document.getElementById('langBtn').textContent = lang==='th'?'EN':'ไทย';
  document.getElementById('editList').innerHTML = tag(EDITS,'edit');
  document.getElementById('addList').innerHTML = tag(ADDS,'add');
}
const slides=()=>[...document.querySelectorAll('.slide')];
function show(i){
  const s=slides(); idx=Math.max(0,Math.min(i,s.length-1));
  s.forEach((el,j)=>el.classList.toggle('active',j===idx));
  document.getElementById('ctr').textContent=(idx+1)+' / '+s.length;
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('next').disabled=idx===s.length-1;
}
document.getElementById('prev').addEventListener('click',()=>show(idx-1));
document.getElementById('next').addEventListener('click',()=>show(idx+1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(idx+1); if(e.key==='ArrowLeft')show(idx-1);});
document.getElementById('langBtn').addEventListener('click',()=>{lang=lang==='th'?'en':'th'; renderStatic();});
renderStatic(); show(0);
</script>
