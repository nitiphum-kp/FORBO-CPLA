<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คู่มือสัญญาบริหารเงินสดรวมศูนย์ (แบบโต้ตอบ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3FAF8; --panel:#FFFFFF; --ink:#0F2C2A; --ink-soft:#4B6B6A;
  --teal:#0E7C74; --teal-dk:#0B5C56; --coral:#FF8A5B; --yellow:#FFC94D; --line:#D8ECE8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1E1D; --panel:#15302E; --ink:#EAF6F4; --ink-soft:#9FC4C0;
    --teal:#3FCFC2; --teal-dk:#2AA89C; --coral:#FF9A6E; --yellow:#FFD873; --line:#1F3F3C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1E1D; --panel:#15302E; --ink:#EAF6F4; --ink-soft:#9FC4C0;
  --teal:#3FCFC2; --teal-dk:#2AA89C; --coral:#FF9A6E; --yellow:#FFD873; --line:#1F3F3C;
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai',sans-serif;line-height:1.65;}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px;}
h1,h2,h3{font-weight:600;margin:0 0 10px;}
h1{font-size:clamp(24px,5vw,32px);}
h2{font-size:22px;color:var(--teal-dk);}
p{margin:0 0 12px;color:var(--ink-soft);}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);}
.brand{font-weight:700;font-size:15px;color:var(--teal-dk);}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--ink-soft);}
.langbtn{border:1.5px solid var(--teal);background:transparent;color:var(--teal-dk);border-radius:999px;padding:7px 16px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;}
.langbtn:hover{background:var(--teal);color:#fff;}
.hero{text-align:center;padding:10px 0 6px;}
.hero p{max-width:560px;margin-inline:auto;}
.mascots{display:flex;justify-content:center;align-items:flex-end;gap:22px;margin:18px 0 6px;}
.mascots svg{width:108px;height:108px;}
.flow{display:flex;justify-content:center;gap:8px;align-items:center;color:var(--coral);font-weight:600;font-size:13px;margin-bottom:22px;}
section{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 22px 26px;margin-bottom:22px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){.grid2{grid-template-columns:1fr;}}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 5px;}
select,input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:15px;}
.btn{margin-top:14px;background:var(--teal);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;}
.btn:hover{background:var(--teal-dk);}
.steps{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
.step{display:flex;gap:12px;align-items:flex-start;}
.step .dot{flex:0 0 30px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;}
.step.info .dot{background:#DDF2EF;color:var(--teal-dk);}
.step.warn .dot{background:#FFE7D6;color:var(--coral);}
.step.end .dot{background:#FFF3CE;color:#8A6A10;}
.step .txt{padding-top:4px;font-size:14.5px;}
.clause{display:inline-block;margin-top:3px;font-size:11.5px;color:var(--teal-dk);background:#E2F5F2;border-radius:6px;padding:2px 7px;}
.result{margin-top:16px;padding:16px;border-radius:14px;background:#EFFAF8;border:1px dashed var(--teal);font-size:14.5px;}
:root[data-theme="dark"] .result,body[data-theme="dark"] .result{background:#0F2C2A;}
.glossary{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){.glossary{grid-template-columns:1fr;}}
.term{display:flex;gap:10px;align-items:flex-start;}
.term svg{flex:0 0 34px;width:34px;height:34px;}
.term h3{font-size:14.5px;margin:0 0 2px;}
.term p{font-size:13px;margin:0;}
footer{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:10px 20px 0;}
</style>
</head>
<body>
<div class="top">
  <div class="brand" data-i18n="brand"></div>
  <button class="langbtn" id="langBtn">EN</button>
</div>
<div class="wrap">

  <div class="hero">
    <h1 data-i18n="h_title"></h1>
    <p data-i18n="h_sub"></p>
    <div class="mascots">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="34" fill="#0E7C74"/><circle cx="38" cy="50" r="4.5" fill="#fff"/><circle cx="62" cy="50" r="4.5" fill="#fff"/><path d="M38 65 Q50 74 62 65" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="30" y="80" width="40" height="16" rx="4" fill="#FFC94D"/><rect x="42" y="22" width="16" height="10" rx="2" fill="#FF8A5B"/></svg>
      <svg viewBox="0 0 100 100"><circle cx="50" cy="58" r="26" fill="#FF8A5B"/><circle cx="41" cy="54" r="3.5" fill="#fff"/><circle cx="59" cy="54" r="3.5" fill="#fff"/><path d="M41 66 Q50 73 59 66" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="50" cy="88" r="10" fill="#FFC94D"/><text x="50" y="93" font-size="11" text-anchor="middle" fill="#8A6A10" font-family="sans-serif">฿</text></svg>
    </div>
    <div class="flow" data-i18n="h_flow"></div>
  </div>

  <section>
    <h2 data-i18n="how_h"></h2>
    <p data-i18n="how_p"></p>
  </section>

  <section>
    <h2 data-i18n="sim_h"></h2>
    <p data-i18n="sim_p"></p>
    <label data-i18n="sim_label"></label>
    <select id="scenSel"></select>
    <div class="steps" id="scenOut"></div>
  </section>

  <section>
    <h2 data-i18n="calc_h"></h2>
    <p data-i18n="calc_p"></p>
    <div class="grid2">
      <div><label data-i18n="calc_type"></label>
        <select id="loanType">
          <option value="down">↓</option>
          <option value="up">↑</option>
        </select>
      </div>
      <div><label data-i18n="calc_amt"></label><input id="amt" type="number" value="1000000" min="0"></div>
      <div><label data-i18n="calc_rfr"></label><input id="rfr" type="number" value="1.5" step="0.01"></div>
      <div><label data-i18n="calc_days"></label><input id="days" type="number" value="30" min="1"></div>
    </div>
    <button class="btn" id="calcBtn" data-i18n="calc_btn"></button>
    <div class="result" id="calcOut" style="display:none"></div>
  </section>

  <section>
    <h2 data-i18n="gloss_h"></h2>
    <div class="glossary" id="gloss"></div>
  </section>

  <footer data-i18n="foot"></footer>
</div>

<script>
const ICONS = {
  bank:'<svg viewBox="0 0 40 40"><rect x="4" y="30" width="32" height="6" rx="1.5" fill="#0E7C74"/><rect x="8" y="16" width="24" height="12" fill="#DDF2EF" stroke="#0E7C74" stroke-width="2"/><polygon points="20,4 36,16 4,16" fill="#0E7C74"/></svg>',
  sub:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#FF8A5B"/><circle cx="20" cy="16" r="5" fill="#fff"/><path d="M11 29c1-6 6-9 9-9s8 3 9 9" fill="#fff"/></svg>',

const L = {

h_title:{th:'สัญญาบริหารเงินสดรวมศูนย์ อ่านง่าย เข้าใจไว', en:'Cash Pooling Agreement, made simple'},
h_sub:{th:'สรุปสัญญาระหว่าง Forbo Management SA (สวิตเซอร์แลนด์) กับ Forbo Siegling (Thailand) Co.,Ltd. เป็นภาษาที่เข้าใจง่าย พร้อมเครื่องมือจำลองสถานการณ์ อ้างอิงจากต้นฉบับภาษาอังกฤษ ไม่ใช่คำแนะนำทางกฎหมาย', en:'A plain-language walkthrough of the agreement between Forbo Management SA (Switzerland) and Forbo Siegling (Thailand) Co.,Ltd., with interactive tools. Based on the English original — not legal advice.'},

how_p:{th:'ทุกคืนหรือทุกวันทำการ เงินในบัญชีของบริษัทย่อย (Participating Account) จะถูก "กวาด" (sweep) รวมเข้าบัญชีหลัก (Master Account) ที่ผู้บริหารจัดการดูแล หรือถูก "เติม" (cover) กลับมาให้พอใช้ การโอนแต่ละครั้งนี้ถือเป็นการก่อ "เงินกู้ยืม" ระหว่างกันโดยอัตโนมัติ — ถ้าบริษัทย่อยมียอดติดลบ ผู้บริหารจัดการคือผู้ให้กู้ (Downstream Loan) แต่ถ้าบริษัทย่อยมีเงินเหลือ บริษัทย่อยกลายเป็นผู้ให้กู้แก่ส่วนกลาง (Upstream Loan) ทั้งหมดนี้ช่วยให้ทั้งกลุ่มบริหารสภาพคล่องได้อย่างมีประสิทธิภาพและได้ดอกเบี้ยที่ดีกว่าฝากธนาคารทั่วไป', en:'Every business day, cash in the Subsidiary\'s Participating Account is "swept" up into the Master Account the Administrator controls — or "covered" (topped up) if it runs short. Each transfer automatically creates a Loan between the two: if the Subsidiary is short, the Administrator lends to it (a Downstream Loan); if the Subsidiary has a surplus, the Subsidiary lends to the group (an Upstream Loan). This keeps the whole group\'s cash working efficiently, at better rates than an ordinary bank account.'},

};

   {t:'end',c:'§9.7',th:'แต่ละฝ่ายมีสิทธินำเงินกู้ยืมขาขึ้น/ขาลงไปหักกลบกับหนี้อื่นที่ถึงกำหนดชำระได้',en:'Each party may set off its Upstream/Downstream Loans against other debts that are due.'}

   {t:'warn',c:'§9.5',th:'หากบริษัทย่อยฝ่าฝืนคำรับรองเหล่านี้ ผู้บริหารจัดการมีสิทธิ (ตามดุลยพินิจอันสมควร) ตัดบริษัทย่อยออกและบอกเลิกสัญญาทันที',en:'If any of these are breached, the Administrator may (using reasonable discretion) exclude the Subsidiary and terminate immediately.'},
   {t:'end',c:'§9.6, §9.7',th:'ชำระคืนภายในไม่น้อยกว่า 1 วันทำการ พร้อมสิทธิหักกลบหนี้เช่นเดิม',en:'Repayment within at least one working day, plus the usual right of set-off.'}

   {t:'info',c:'§7.1',th:'คู่สัญญาแต่ละฝ่ายขอให้ชำระสะสางเงินกู้ยืมรายการใดหรือทั้งหมดได้ทุกเมื่อ โดยต้องดำเนินการให้แล้วเสร็จภายใน 24 ชั่วโมง',en:'Either party may request settlement of any or all Loans at any time, to be carried out within 24 hours.'},

 {icon:'sub', th:['บริษัทย่อย (Subsidiary)','Forbo Siegling (Thailand) ผู้เข้าร่วมระบบผ่านบัญชี Participating Account'], en:['Subsidiary','Forbo Siegling (Thailand) — takes part via its Participating Account.']},
 {icon:'vault', th:['บัญชีหลัก (Master Account)','บัญชีกลางที่เงินทุกบัญชีถูกกวาดเข้ามารวมหรือเติมออกไป'], en:['Master Account','The central account every Participating Account sweeps into or is covered from.']},
 {icon:'arrows', th:['กวาด / เติม (Sweep / Cover)','การโอนเงินอัตโนมัติระหว่างบัญชีย่อยกับบัญชีหลัก'], en:['Sweep / Cover','The automatic transfer between a Participating Account and the Master Account.']},

 {icon:'policy', th:['นโยบาย Cash Pool (Cash Pool Policy)','กติกากลางของกลุ่มฟอร์โบที่ทุกบริษัทต้องปฏิบัติตาม'], en:['Cash Pool Policy','The Forbo Group\'s standing rules that every participant must follow.']},

let lang = 'th';

function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(L[k]) el.textContent = L[k][lang];
  });
  document.getElementById('langBtn').textContent = lang==='th' ? 'EN' : 'ไทย';
}
function renderScenSelect(){
  const sel = document.getElementById('scenSel');
  const prev = sel.value;
  sel.innerHTML = SCEN.map(s=>`<option value="${s.id}">${s.label[lang]}</option>`).join('');
  sel.value = prev || SCEN[0].id;
  renderScenSteps();
}
function renderScenSteps(){
  const s = SCEN.find(s=>s.id===document.getElementById('scenSel').value) || SCEN[0];
  document.getElementById('scenOut').innerHTML = s.steps.map(st=>
    `<div class="step ${st.t}"><div class="dot">${st.t==='end'?'✓':st.t==='warn'?'!':'i'}</div>
     <div class="txt">${st[lang]}<br><span class="clause">${st.c}</span></div></div>`).join('');
}
function renderGloss(){
  const opts = document.getElementById('loanType');
  opts.innerHTML = `<option value="down">${L.optType.down[lang]}</option><option value="up">${L.optType.up[lang]}</option>`;
  document.getElementById('gloss').innerHTML = GLOSS.map(g=>{
    const [t,d] = g[lang];
    return `<div class="term">${ICONS[g.icon]}<div><h3>${t}</h3><p>${d}</p></div></div>`;
  }).join('');
}
function calc(){
  const type = document.getElementById('loanType').value;
  const amt = parseFloat(document.getElementById('amt').value)||0;
  let rfr = parseFloat(document.getElementById('rfr').value)||0;
  const days = parseFloat(document.getElementById('days').value)||0;
  if(rfr<0) rfr = 0;
  const margin = type==='down' ? -0.10 : 1.00;
  const rate = rfr + margin;
  const interest = amt * (rate/100) * (days/365);
  const payer = type==='down' ? {th:'บริษัทย่อยจ่ายให้ผู้บริหารจัดการ',en:'the Subsidiary pays the Administrator'}
                                : {th:'ผู้บริหารจัดการจ่ายให้บริษัทย่อย',en:'the Administrator pays the Subsidiary'};
  const out = document.getElementById('calcOut');
  out.style.display='block';
  out.innerHTML = lang==='th'
    ? `อัตราดอกเบี้ยที่ใช้: RFR ${rfr.toFixed(2)}% + Margin ${margin>0?'+':''}${margin.toFixed(2)}% = <b>${rate.toFixed(2)}% ต่อปี</b><br>
       ดอกเบี้ยโดยประมาณ ${days} วัน: <b>${interest.toLocaleString('th-TH',{maximumFractionDigits:2})} บาท</b><br>
       ทิศทางการจ่าย: ${payer.th} (§3.1)`
    : `Rate used: RFR ${rfr.toFixed(2)}% + Margin ${margin>0?'+':''}${margin.toFixed(2)}% = <b>${rate.toFixed(2)}% p.a.</b><br>
       Estimated interest over ${days} days: <b>THB ${interest.toLocaleString('en-US',{maximumFractionDigits:2})}</b><br>
       Who pays whom: ${payer.en} (§3.1)`;
}

document.getElementById('langBtn').addEventListener('click',()=>{
  lang = lang==='th' ? 'en' : 'th';
  renderStatic(); renderScenSelect(); renderGloss();
  document.getElementById('calcOut').style.display='none';
});
document.getElementById('scenSel').addEventListener('change', renderScenSteps);
document.getElementById('calcBtn').addEventListener('click', calc);

renderStatic(); renderScenSelect(); renderGloss();
</script>
